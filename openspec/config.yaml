schema: spec-driven

context: |
  dsh-plugin-gentleai-engram — 非官方第三方桥插件，把 engram 持久记忆后端
  （Gentleman-Programming/engram，本机 1.20.0）接入 DeepSeek Harness（dsh）。

  技术栈：TypeScript (ESM)、Node >= 24（`package.json` 的 engines；实测下限，
  24.16.0 与 26.7.0 均端到端通过——检索需要无需 flag 的 node:sqlite）。运行时
  依赖按危害分层，不按"零第三方"
  划线：宿主进程内绝不加载原生扩展/addon；host 提供的 @deepseek-ai/* 优先；
  纯 JS/WASM 依赖只在子进程内，且精确锁版本、有机制证明未被宿主入口加载。
  MCP 走 stdio，自实现最小 JSON-RPC 客户端（理由是拓扑：每个工作区一个长驻
  stdio 子进程 + 多路复用，不是"零依赖"）。

  交付形态：dsh bundle 包 —— package.json 声明 dsh.bundle.patch →
  cordis.patch.yml 提供 engram-bridge entry；按 profile 用
  `dsh plugin --profile <p> add <path>` 以 pnpm link: 安装。

  验证命令：pnpm typecheck / pnpm test / pnpm build；
  加载验证 `dsh --profile web --dump-config | grep engram-bridge`；
  端到端验证靠 sqlite3 查 ~/.engram/engram.db。

  非目标：不改 engram 后端（不 fork、不打 patch、不直接写库）、不成为记忆的
  第二个真相来源（任何派生数据都必须可从正本确定性重算、删除即恢复、不进同步
  与备份）、不接管云同步。

  写层（保存入口）的两条硬边界：桥给出的候选**不得裁决语义**——它只摆机械
  事实（相同/不同、共享了什么、名次），关系由调用方裁决；候选与证据**不依赖
  生成式模型**（固定枚举的句子 + 机械谓词填空，不是生成措辞）。
  安装前提：保存走 engram 的 HTTP 写入面，因此要求 `engram serve` 在跑
  （默认端口 7437）；插件**不负责发现或启动它**（那个进程同时承载云同步）。
  服务不在时保存回退到上游写入工具，日志与结果文本说明情况——这与硬规则 7 的
  依赖分层不冲突：HTTP 写入只用 Node 内置 `fetch`，不新增任何进程内运行时。

  约束：不新增 dsh 会话事件类型（未标记的未知事件类型会让会话日志报
  SessionFormatUnsupportedError）；常驻的协议文本是一段**静态**的系统提示词段
  （内容随插件版本走、逐回合恒定；子 agent 拿空段）。

rules:
  proposal:
    - 「Why」「What Changes」「验收信号」三节正文合计不超过 600 个字符（按非空白字符计，含标点与行内代码；表格行与代码块不计）
    - 必须写出可观察的验收信号，而不是实现步骤（这条比篇幅优先：不得为凑篇幅而挤压验收信号，也不得把本该是正文的论述塞进表格以规避计数）
  tasks:
    - 每个任务必须写明验证方式（命令、测试或可观察产物）
