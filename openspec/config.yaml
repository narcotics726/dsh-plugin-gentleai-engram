schema: spec-driven

context: |
  dsh-plugin-gentleai-engram — 非官方第三方桥插件，把 engram 持久记忆后端
  （Gentleman-Programming/engram，本机 1.20.0）接入 DeepSeek Harness（dsh）。

  技术栈：TypeScript (ESM)、Node >= 22、零运行时依赖（只用 Node 内置模块；
  MCP 走 stdio，自实现最小 JSON-RPC 客户端）。

  交付形态：dsh bundle 包 —— package.json 声明 dsh.bundle.patch →
  cordis.patch.yml 提供 engram-bridge entry；按 profile 用
  `dsh plugin --profile <p> add <path>` 以 pnpm link: 安装。

  验证命令：pnpm typecheck / pnpm test / pnpm build；
  加载验证 `dsh --profile web --dump-config | grep engram-bridge`；
  端到端验证靠 sqlite3 查 ~/.engram/engram.db。

  非目标：不改 engram 后端（不 fork、不打 patch、不直接写库）、不做记忆系统
  本身（检索/向量/图谱/清理策略）、不接管云同步。

  约束：不新增 dsh 会话事件类型（未标记的未知事件类型会让会话日志报
  SessionFormatUnsupportedError）；P0 不新增 system prompt 段（KV cache）。

rules:
  proposal:
    - 控制在 600 字以内
    - 必须写出可观察的验收信号，而不是实现步骤
  tasks:
    - 每个任务必须写明验证方式（命令、测试或可观察产物）
