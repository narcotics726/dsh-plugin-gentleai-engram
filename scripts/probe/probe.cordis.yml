# Probe overlay for dsh profiles: one global observer plugin.
#   dsh --profile headless --patch <rendered>/probe.cordis.yml "<task>"
#
# This file is a TEMPLATE. The loader interpolates `!!js` only inside an
# entry's `config` (cordis-plugin-loader `internal/config` handler); a `!!js`
# `name` is never evaluated and reaches `Entry.import` as a plain object
# ("name.startsWith is not a function"). The machine-specific absolute paths
# therefore cannot come from `!!js`, and must not be checked in either:
# run-probe.sh renders the @@…@@ tokens below into a throwaway copy under the
# disposable DSH home and passes THAT path to `--patch`.
#
# Tokens (written here spaced so this comment survives rendering):
#   @@ PROBE_PLUGIN_MODULE @@   @@ PROBE_OUT @@        @@ PROBE_SCENARIO @@
#   @@ PROBE_DENY @@            @@ PROBE_ABORT_AFTER_CHARS @@   @@ PROBE_LLM_MODULE @@
#   @@ PROBE_MARKER @@  substring counted inside the rendered system prompt
- insert:
    - id: probe-events
      name: "@@PROBE_PLUGIN_MODULE@@"
      config:
        out: "@@PROBE_OUT@@"
        scenario: "@@PROBE_SCENARIO@@"
        deny: "@@PROBE_DENY@@"
        abortAfterChars: "@@PROBE_ABORT_AFTER_CHARS@@"
        marker: "@@PROBE_MARKER@@"
        llmModule: "@@PROBE_LLM_MODULE@@"
